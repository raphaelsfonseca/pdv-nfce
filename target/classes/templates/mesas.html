<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesas - PDV NFCe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }</script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-gray-50 font-sans antialiased">

    <div th:if="${sucesso}" data-success-message="${sucesso}" hidden></div>
    <div th:if="${erro}" data-error-message="${erro}" hidden></div>

    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div th:replace="~{fragments/layout :: toasts}"></div>

    <div class="ml-0 lg:ml-64 transition-all duration-300">
        <div class="p-6 lg:p-8" x-data="mesasApp()">

            <!-- Header -->
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Mesas</h1>
                    <p class="text-sm text-gray-500 mt-1">Visao geral do estabelecimento</p>
                </div>
                <button x-on:click="showNewMesa = true"
                        class="inline-flex items-center space-x-2 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold transition-colors shadow-lg shadow-indigo-600/25">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>Nova Mesa</span>
                </button>
            </div>

            <!-- Stats Bar -->
            <div class="grid grid-cols-3 gap-4 mb-8">
                <div class="bg-white rounded-xl border border-gray-100 p-4 flex items-center space-x-3 shadow-sm">
                    <div class="w-10 h-10 bg-emerald-100 rounded-lg flex items-center justify-center">
                        <i data-lucide="check-circle" class="w-5 h-5 text-emerald-600"></i>
                    </div>
                    <div>
                        <p class="text-2xl font-bold text-gray-900" x-text="livres"></p>
                        <p class="text-xs text-gray-500">Livres</p>
                    </div>
                </div>
                <div class="bg-white rounded-xl border border-gray-100 p-4 flex items-center space-x-3 shadow-sm">
                    <div class="w-10 h-10 bg-amber-100 rounded-lg flex items-center justify-center">
                        <i data-lucide="users" class="w-5 h-5 text-amber-600"></i>
                    </div>
                    <div>
                        <p class="text-2xl font-bold text-gray-900" x-text="ocupadas"></p>
                        <p class="text-xs text-gray-500">Ocupadas</p>
                    </div>
                </div>
                <div class="bg-white rounded-xl border border-gray-100 p-4 flex items-center space-x-3 shadow-sm">
                    <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center">
                        <i data-lucide="calendar" class="w-5 h-5 text-blue-600"></i>
                    </div>
                    <div>
                        <p class="text-2xl font-bold text-gray-900" x-text="reservadas"></p>
                        <p class="text-xs text-gray-500">Reservadas</p>
                    </div>
                </div>
            </div>

            <!-- Table Grid -->
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
                <template x-for="mesa in mesas" :key="mesa.id">
                    <div class="rounded-2xl p-5 text-center border-2 shadow-sm transition-all"
                         :class="mesa.status === 'OCUPADA' ? 'bg-amber-50 border-amber-200' : mesa.status === 'RESERVADA' ? 'bg-blue-50 border-blue-200' : 'bg-white border-gray-100 hover:border-indigo-300 hover:shadow-md'">

                        <div class="text-3xl font-bold mb-1"
                             :class="mesa.status === 'OCUPADA' ? 'text-amber-700' : mesa.status === 'RESERVADA' ? 'text-blue-700' : 'text-gray-900'"
                             x-text="'#' + mesa.numero"></div>

                        <div class="flex items-center justify-center space-x-1 text-xs text-gray-400 mb-3">
                            <i data-lucide="users" class="w-3 h-3"></i>
                            <span x-text="mesa.capacidade + ' pessoas'"></span>
                        </div>

                        <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold mb-2"
                              :class="mesa.status === 'OCUPADA' ? 'bg-amber-200 text-amber-800' : mesa.status === 'RESERVADA' ? 'bg-blue-200 text-blue-800' : 'bg-emerald-100 text-emerald-700'"
                              x-text="mesa.status === 'LIVRE' ? 'Livre' : mesa.status === 'OCUPADA' ? 'Ocupada' : 'Reservada'"></span>

                        <!-- Order Info for occupied tables -->
                        <div x-show="mesa.status === 'OCUPADA' && mesa.pedidoAtual" class="mt-2 p-2 bg-white rounded-lg border border-amber-100 text-left">
                            <div class="flex items-center justify-between text-xs mb-1">
                                <span class="text-gray-500">Pedido</span>
                                <span class="font-semibold text-amber-700" x-text="'#' + (mesa.pedidoAtual ? mesa.pedidoAtual.id : '')"></span>
                            </div>
                            <div class="flex items-center justify-between text-xs mb-1">
                                <span class="text-gray-500">Itens</span>
                                <span class="font-medium text-gray-700" x-text="mesa.pedidoAtual && mesa.pedidoAtual.itens ? mesa.pedidoAtual.itens.length : 0"></span>
                            </div>
                            <div class="flex items-center justify-between text-xs">
                                <span class="text-gray-500">Total</span>
                                <span class="font-bold text-amber-700" x-text="mesa.pedidoAtual ? formatCurrency(mesa.pedidoAtual.valorTotal) : 'R$ 0,00'"></span>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="mt-3 space-y-2">
                            <button x-show="mesa.status === 'LIVRE'"
                                    x-on:click="openMesaModal(mesa)"
                                    class="block w-full px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold transition-colors">
                                Abrir Mesa
                            </button>
                            <a x-show="mesa.status === 'OCUPADA' && mesa.pedidoAtual"
                               :href="'/pdv?pedidoId=' + mesa.pedidoAtual.id"
                               class="block w-full px-3 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-xs font-semibold transition-colors">
                                Ver Pedido
                            </a>
                            <span x-show="mesa.status === 'RESERVADA'"
                                  class="block w-full px-3 py-2 bg-blue-100 text-blue-700 rounded-lg text-xs font-semibold">
                                Reservada
                            </span>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Empty State -->
            <div x-show="mesas.length === 0" class="text-center py-16">
                <i data-lucide="table" class="w-16 h-16 text-gray-300 mx-auto mb-4"></i>
                <h3 class="text-lg font-semibold text-gray-700 mb-1">Nenhuma mesa cadastrada</h3>
                <p class="text-gray-400 text-sm mb-6">Adicione mesas ao seu estabelecimento</p>
                <button x-on:click="showNewMesa = true"
                        class="inline-flex items-center space-x-2 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold transition-colors">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>Criar Primeira Mesa</span>
                </button>
            </div>

            <!-- New Mesa Modal -->
            <div x-show="showNewMesa" x-cloak
                 class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0"
                 x-transition:enter-end="opacity-100"
                 x-transition:leave="transition ease-in duration-150"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0">
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 overflow-hidden"
                     x-transition:enter="transition ease-out duration-200"
                     x-transition:enter-start="opacity-0 scale-95"
                     x-transition:enter-end="opacity-100 scale-100"
                     x-on:click.outside="showNewMesa = false">
                    <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                        <h3 class="text-lg font-bold text-gray-900">Nova Mesa</h3>
                        <button x-on:click="showNewMesa = false" class="text-gray-400 hover:text-gray-600">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <form th:action="@{/mesas/salvar}" method="POST" class="p-6 space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Numero da Mesa *</label>
                            <input type="number" name="numero" min="1" required
                                   class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:border-indigo-500"
                                   placeholder="Ex: 1">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Capacidade</label>
                            <input type="number" name="capacidade" min="1" value="4"
                                   class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Observacao</label>
                            <input type="text" name="observacao"
                                   class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:border-indigo-500"
                                   placeholder="Ex: Area externa">
                        </div>
                        <div class="flex space-x-3 pt-2">
                            <button type="submit"
                                    class="flex-1 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold transition-colors">
                                Criar Mesa
                            </button>
                            <button type="button" x-on:click="showNewMesa = false"
                                    class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-sm font-medium transition-colors">
                                Cancelar
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Open Mesa with Client Modal -->
            <div x-show="showOpenMesaModal" x-cloak
                 class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0"
                 x-transition:enter-end="opacity-100"
                 x-transition:leave="transition ease-in duration-150"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0">
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 overflow-hidden"
                     x-transition:enter="transition ease-out duration-200"
                     x-transition:enter-start="opacity-0 scale-95"
                     x-transition:enter-end="opacity-100 scale-100"
                     x-on:click.outside="showOpenMesaModal = false">
                    <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                        <h3 class="text-lg font-bold text-gray-900">Abrir Mesa</h3>
                        <button x-on:click="showOpenMesaModal = false" class="text-gray-400 hover:text-gray-600">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <div class="p-6 space-y-4">
                        <div>
                            <p class="text-sm text-gray-600 mb-2">Mesa <span class="font-bold text-indigo-600" x-text="'#' + (selectedMesaForOpen ? selectedMesaForOpen.numero : '')"></span></p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Cliente</label>
                            <div class="space-y-2">
                                <label class="flex items-center space-x-2">
                                    <input type="radio" name="clientType" value="existing" x-model="clientType"
                                           class="w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                                    <span class="text-sm text-gray-700">Selecionar cadastrado</span>
                                </label>
                                <label class="flex items-center space-x-2">
                                    <input type="radio" name="clientType" value="new" x-model="clientType"
                                           class="w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                                    <span class="text-sm text-gray-700">Digitar nome</span>
                                </label>
                            </div>
                            <div x-show="clientType === 'existing'" x-transition>
                                <select x-model="selectedClientForOpen" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm bg-white focus:border-indigo-500">
                                    <option value="">Sem cliente (Balcao)</option>
                                    <template x-for="cliente in clientes" :key="cliente.id">
                                        <option :value="cliente.id" x-text="cliente.nome"></option>
                                    </template>
                                </select>
                            </div>
                            <div x-show="clientType === 'new'" x-transition>
                                <input type="text" x-model="newClientName"
                                       placeholder="Nome do cliente"
                                       class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:border-indigo-500">
                            </div>
                        </div>
                        <div class="flex space-x-3 pt-2">
                            <button x-on:click="confirmOpenMesa()"
                                    class="flex-1 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold transition-colors">
                                Confirmar
                            </button>
                            <button x-on:click="showOpenMesaModal = false"
                                    class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-sm font-medium transition-colors">
                                Cancelar
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:inline="javascript">
        lucide.createIcons();

        function mesasApp() {
            return {
                showNewMesa: false,
                showOpenMesaModal: false,
                selectedMesaForOpen: null,
                selectedClientForOpen: '',
                newClientName: '',
                clientType: 'existing',
                mesas: [],
                clientes: [],
                get livres() { return this.mesas.filter(m => m.status === 'LIVRE').length; },
                get ocupadas() { return this.mesas.filter(m => m.status === 'OCUPADA').length; },
                get reservadas() { return this.mesas.filter(m => m.status === 'RESERVADA').length; },
                init() {
                    this.mesas = /*[[${mesas}]]*/ [];
                    this.clientes = /*[[${clientes}]]*/ [];
                },
                formatCurrency: formatCurrency,
                openMesaModal(mesa) {
                    this.selectedMesaForOpen = mesa;
                    this.selectedClientForOpen = '';
                    this.newClientName = '';
                    this.clientType = 'existing';
                    this.showOpenMesaModal = true;
                },
                confirmOpenMesa() {
                    if (!this.selectedMesaForOpen) return;
                    let url = '/pdv?mesaId=' + this.selectedMesaForOpen.id;
                    
                    if (this.clientType === 'existing' && this.selectedClientForOpen) {
                        url += '&clienteId=' + this.selectedClientForOpen;
                    } else if (this.clientType === 'new' && this.newClientName.trim()) {
                        url += '&novoClienteNome=' + encodeURIComponent(this.newClientName.trim());
                    }
                    
                    this.showOpenMesaModal = false;
                    window.location.href = url;
                }
            };
        }
    </script>
</body>
</html>
