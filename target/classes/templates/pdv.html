<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV - Ponto de Venda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-gray-50 font-sans antialiased h-screen overflow-hidden"
      x-data="pdvApp()"
      x-init="init()">

    <div th:if="${sucesso}" data-success-message="${sucesso}" hidden></div>
    <div th:if="${erro}" data-error-message="${erro}" hidden></div>

    <div th:replace="~{fragments/layout :: toasts}"></div>

    <!-- TOP BAR -->
    <div class="bg-gray-900 text-white h-14 flex items-center justify-between px-4 shadow-lg z-50 relative">
        <div class="flex items-center space-x-4">
            <a href="/" class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
                    <i data-lucide="credit-card" class="w-4 h-4"></i>
                </div>
                <span class="font-bold text-lg">PDV NFCe</span>
            </a>
            <div class="h-6 w-px bg-gray-700"></div>
            <div class="flex items-center space-x-2 text-sm text-gray-300">
                <i data-lucide="table" class="w-4 h-4"></i>
                <span x-text="selectedTable ? 'Mesa ' + selectedTable.numero : 'Balcão'">Balcão</span>
            </div>
            <div class="flex items-center space-x-2 text-sm text-gray-300" x-show="currentOrderId">
                <i data-lucide="hash" class="w-4 h-4"></i>
                <span>Pedido #</span>
                <span x-text="currentOrderId" class="font-semibold text-white"></span>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-2 text-sm text-gray-300">
                <i data-lucide="clock" class="w-4 h-4"></i>
                <span x-text="currentTime" class="font-mono"></span>
            </div>
            <a href="/" class="text-gray-400 hover:text-white transition-colors">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
            </a>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="flex h-[calc(100vh-3.5rem)]">

        <!-- LEFT PANEL: Products (40%) -->
        <div class="w-2/5 bg-white border-r border-gray-200 flex flex-col overflow-hidden">

            <div class="p-4 border-b border-gray-100">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                    <input type="text"
                           x-model="searchQuery"
                           placeholder="Buscar produto..."
                           class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all">
                </div>
            </div>

            <div class="px-4 py-2 border-b border-gray-100 overflow-x-auto flex-shrink-0">
                <div class="flex space-x-2">
                    <button x-on:click="selectedCategory = 'Todos'"
                            class="px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-all"
                            :class="selectedCategory === 'Todos' ? 'bg-indigo-600 text-white shadow-md' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'">
                        Todos
                    </button>
                    <template x-for="cat in categorias" :key="cat">
                        <button x-on:click="selectedCategory = cat"
                                class="px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-all"
                                :class="selectedCategory === cat ? 'bg-indigo-600 text-white shadow-md' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
                                x-text="cat">
                        </button>
                    </template>
                </div>
            </div>

            <!-- Product Grid with Quantity Selector -->
            <div class="flex-1 overflow-y-auto p-4">
                <div class="grid grid-cols-2 xl:grid-cols-3 gap-3">
                    <template x-for="produto in filteredProducts" :key="produto.id">
                        <div class="product-card bg-white border rounded-xl p-3 flex flex-col"
                             :class="produto.estoqueAtual <= 0 ? 'opacity-50 cursor-not-allowed border-red-200' : produto.estoqueAtual <= produto.estoqueMinimo ? 'low-stock border-amber-200' : 'border-gray-200 hover:border-indigo-300'">
                            <div class="flex items-start justify-between mb-2">
                                <span class="inline-block px-2 py-0.5 bg-gray-100 text-gray-600 text-xs rounded-full font-medium"
                                      x-text="produto.categoria || 'Sem cat.'"></span>
                                <span class="text-xs font-semibold"
                                      :class="produto.estoqueAtual <= 0 ? 'text-red-500' : produto.estoqueAtual <= produto.estoqueMinimo ? 'text-amber-500' : 'text-emerald-500'"
                                      x-text="produto.estoqueAtual <= 0 ? 'Sem estoque' : 'Est: ' + produto.estoqueAtual">
                                </span>
                            </div>
                            <h3 class="text-sm font-semibold text-gray-900 mb-1 line-clamp-2 flex-1" x-text="produto.nome"></h3>
                            <div class="mt-2">
                                <span class="text-lg font-bold text-indigo-600" x-text="formatCurrency(produto.precoVenda)"></span>
                            </div>
                            <!-- Quantity Selector + Add Button -->
                            <div class="mt-3 flex items-center space-x-2" x-show="produto.estoqueAtual > 0">
                                <div class="flex items-center border border-gray-200 rounded-lg overflow-hidden">
                                    <button x-on:click.stop="decrementQty(produto)"
                                            class="w-7 h-7 flex items-center justify-center text-gray-600 hover:bg-gray-100 transition-colors text-sm font-bold">
                                        -
                                    </button>
                                    <span class="w-8 text-center text-sm font-semibold text-gray-900 border-x border-gray-200 h-7 leading-7"
                                          x-text="getQty(produto.id)"></span>
                                    <button x-on:click.stop="incrementQty(produto)"
                                            class="w-7 h-7 flex items-center justify-center text-gray-600 hover:bg-gray-100 transition-colors text-sm font-bold">
                                        +
                                    </button>
                                </div>
                                <button x-on:click.stop="addToOrder(produto)"
                                        class="flex-1 h-7 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg transition-colors flex items-center justify-center space-x-1">
                                    <i data-lucide="plus" class="w-3 h-3"></i>
                                    <span>Adicionar</span>
                                </button>
                            </div>
                        </div>
                    </template>
                </div>
                <div x-show="filteredProducts.length === 0" class="text-center py-12">
                    <i data-lucide="package" class="w-12 h-12 text-gray-300 mx-auto mb-3"></i>
                    <p class="text-gray-500 text-sm">Nenhum produto encontrado</p>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL: Order/Cart (60%) -->
        <div class="w-3/5 flex flex-col bg-gray-50">

            <!-- Order Header -->
            <div class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between flex-shrink-0">
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="shopping-bag" class="w-5 h-5 text-indigo-600"></i>
                        <span class="text-lg font-bold text-gray-900"
                              x-text="selectedTable ? 'Mesa ' + selectedTable.numero : 'Balcão'">Balcão</span>
                    </div>
                    <template x-if="currentOrderId">
                        <div class="flex items-center space-x-2">
                            <div class="h-5 w-px bg-gray-300"></div>
                            <span class="text-sm text-gray-500">Pedido <span class="font-semibold text-gray-900" x-text="'#' + currentOrderId"></span></span>
                        </div>
                    </template>
                    <template x-if="orderClientName">
                        <div class="flex items-center space-x-2">
                            <div class="h-5 w-px bg-gray-300"></div>
                            <span class="text-sm text-gray-500" x-text="orderClientName"></span>
                        </div>
                    </template>
                </div>
                <div class="flex items-center space-x-3">
                    <!-- Client selector -->
                    <div class="relative" x-data="{ open: false }">
                        <button x-on:click="open = !open"
                                class="flex items-center space-x-1.5 px-3 py-1.5 text-sm text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors">
                            <i data-lucide="user" class="w-4 h-4"></i>
                            <span x-text="orderClientName || 'Cliente'"></span>
                        </button>
                        <div x-show="open" x-on:click.outside="open = false" x-cloak
                             class="absolute right-0 top-full mt-1 w-56 bg-white rounded-xl shadow-lg border border-gray-200 py-1 z-50">
                            <button x-on:click="assignClient(null); open = false"
                                    class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center space-x-2"
                                    :class="!selectedClientId && !orderClientName ? 'text-indigo-600 font-medium' : 'text-gray-700'">
                                <span>Sem cliente</span>
                            </button>
                            <template x-for="cliente in clientes" :key="cliente.id">
                                <button x-on:click="assignClient(cliente); open = false"
                                        class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center space-x-2"
                                        :class="selectedClientId == cliente.id ? 'text-indigo-600 font-medium' : 'text-gray-700'">
                                    <span x-text="cliente.nome"></span>
                                </button>
                            </template>
                        </div>
                    </div>
                    <!-- Mesa selector -->
                    <div class="relative" x-data="{ open: false }">
                        <button x-on:click="open = !open"
                                class="flex items-center space-x-1.5 px-3 py-1.5 text-sm text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors">
                            <i data-lucide="table" class="w-4 h-4"></i>
                            <span x-text="selectedTable ? 'Mesa ' + selectedTable.numero : 'Mesa'"></span>
                        </button>
                        <div x-show="open" x-on:click.outside="open = false" x-cloak
                             class="absolute right-0 top-full mt-1 w-56 bg-white rounded-xl shadow-lg border border-gray-200 py-1 z-50">
                            <button x-on:click="unassignMesa(); open = false"
                                    class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center space-x-2"
                                    :class="!selectedTable ? 'text-indigo-600 font-medium' : 'text-gray-700'">
                                <span>Sem mesa (Balcão)</span>
                            </button>
                            <template x-for="mesa in mesas" :key="mesa.id">
                                <button x-on:click="assignMesa(mesa); open = false"
                                        :disabled="mesa.status === 'OCUPADA'"
                                        class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center justify-between"
                                        :class="selectedTable && selectedTable.id === mesa.id ? 'text-indigo-600 font-medium' : 'text-gray-700'">
                                    <span x-text="'Mesa ' + mesa.numero"></span>
                                    <span class="text-xs px-1.5 py-0.5 rounded-full"
                                          :class="mesa.status === 'OCUPADA' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'"
                                          x-text="mesa.status === 'OCUPADA' ? 'Ocupada' : 'Livre'"></span>
                                </button>
                            </template>
                        </div>
                    </div>
                    <button x-on:click="newOrder()"
                            class="flex items-center space-x-1.5 px-3 py-1.5 text-sm text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>Novo</span>
                    </button>
                </div>
            </div>

            <div class="flex-1 flex flex-col overflow-hidden">
                <div class="flex-1 overflow-y-auto px-6 py-4">
                    <div class="space-y-3">
                        <template x-for="(item, index) in orderItems" :key="item.produtoId">
                            <div class="bg-white rounded-xl border border-gray-200 p-4 flex items-center space-x-4 shadow-sm">
                                <div class="flex-1">
                                    <h4 class="text-sm font-semibold text-gray-900" x-text="item.nome"></h4>
                                    <p class="text-xs text-gray-500" x-text="formatCurrency(item.precoUnitario) + ' un.'"></p>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <button x-on:click="updateQuantity(index, -1)"
                                            class="qty-btn w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-600 transition-colors font-bold">
                                        -
                                    </button>
                                    <span class="w-8 text-center font-semibold text-gray-900" x-text="item.quantidade"></span>
                                    <button x-on:click="updateQuantity(index, 1)"
                                            class="qty-btn w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-600 transition-colors font-bold">
                                        +
                                    </button>
                                </div>
                                <div class="text-right min-w-[90px]">
                                    <span class="text-sm font-bold text-gray-900" x-text="formatCurrency(item.quantidade * item.precoUnitario)"></span>
                                </div>
                                <button x-on:click="removeItem(index)"
                                        class="text-gray-400 hover:text-red-500 transition-colors p-1">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </template>
                    </div>

                    <div x-show="orderItems.length === 0" class="text-center py-16">
                        <i data-lucide="shopping-cart" class="w-16 h-16 text-gray-300 mx-auto mb-4"></i>
                        <p class="text-gray-500 text-lg font-medium">Carrinho vazio</p>
                        <p class="text-gray-400 text-sm mt-1">Selecione produtos ao lado para adicionar</p>
                    </div>
                </div>

                <div class="bg-white border-t border-gray-200 px-6 py-4 flex-shrink-0">
                    <div class="space-y-2 mb-4">
                        <div class="flex justify-between text-sm text-gray-600">
                            <span>Subtotal</span>
                            <span x-text="formatCurrency(orderSubtotal)"></span>
                        </div>
                        <div class="flex justify-between text-sm text-gray-600" x-show="orderDiscount > 0">
                            <span>Desconto</span>
                            <span class="text-red-500" x-text="'- ' + formatCurrency(orderDiscount)"></span>
                        </div>
                        <div class="flex justify-between text-lg font-bold text-gray-900 pt-2 border-t border-gray-100">
                            <span>Total</span>
                            <span x-text="formatCurrency(orderSubtotal - orderDiscount)"></span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <button x-on:click="showDiscountModal = true"
                                class="px-4 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-sm font-medium transition-colors flex items-center justify-center space-x-2">
                            <i data-lucide="percent" class="w-4 h-4"></i>
                            <span>Desconto</span>
                        </button>
                        <button x-on:click="showSplitModal = true"
                                class="px-4 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-sm font-medium transition-colors flex items-center justify-center space-x-2">
                            <i data-lucide="users" class="w-4 h-4"></i>
                            <span>Dividir Conta</span>
                        </button>
                        <button x-on:click="cancelOrder()"
                                class="px-4 py-3 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-sm font-medium transition-colors flex items-center justify-center space-x-2">
                            <i data-lucide="x-circle" class="w-4 h-4"></i>
                            <span>Cancelar</span>
                        </button>
                        <button x-on:click="showPaymentModal = true; paymentTotal = orderSubtotal - orderDiscount;"
                                :disabled="orderItems.length === 0"
                                class="px-4 py-3 bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white rounded-xl text-sm font-semibold transition-colors flex items-center justify-center space-x-2 shadow-lg shadow-indigo-600/25">
                            <i data-lucide="credit-card" class="w-4 h-4"></i>
                            <span>Fechar Pedido</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PAYMENT MODAL -->
    <div x-show="showPaymentModal" x-cloak
         class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 overflow-hidden"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 scale-95"
             x-transition:enter-end="opacity-100 scale-100"
             x-on:click.outside="showPaymentModal = false">

            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                <h3 class="text-lg font-bold text-gray-900">Finalizar Pedido</h3>
                <button x-on:click="showPaymentModal = false" class="text-gray-400 hover:text-gray-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="p-6">
                <div class="text-center mb-6">
                    <p class="text-sm text-gray-500">Total a Pagar</p>
                    <p class="text-4xl font-bold text-gray-900" x-text="formatCurrency(paymentTotal)"></p>
                </div>

                <p class="text-sm font-medium text-gray-700 mb-3">Forma de Pagamento</p>
                <div class="grid grid-cols-2 gap-3 mb-6">
                    <button x-on:click="paymentMethod = 'DINHEIRO'"
                            class="payment-method-card p-4 rounded-xl border-2 text-center transition-all"
                            :class="paymentMethod === 'DINHEIRO' ? 'border-indigo-500 bg-indigo-50 shadow-md' : 'border-gray-200 hover:border-gray-300'">
                        <i data-lucide="banknote" class="w-8 h-8 mx-auto mb-2"
                           :class="paymentMethod === 'DINHEIRO' ? 'text-indigo-600' : 'text-gray-400'"></i>
                        <span class="text-sm font-semibold"
                              :class="paymentMethod === 'DINHEIRO' ? 'text-indigo-700' : 'text-gray-700'">Dinheiro</span>
                    </button>
                    <button x-on:click="paymentMethod = 'CARTAO_CREDITO'"
                            class="payment-method-card p-4 rounded-xl border-2 text-center transition-all"
                            :class="paymentMethod === 'CARTAO_CREDITO' ? 'border-indigo-500 bg-indigo-50 shadow-md' : 'border-gray-200 hover:border-gray-300'">
                        <i data-lucide="credit-card" class="w-8 h-8 mx-auto mb-2"
                           :class="paymentMethod === 'CARTAO_CREDITO' ? 'text-indigo-600' : 'text-gray-400'"></i>
                        <span class="text-sm font-semibold"
                              :class="paymentMethod === 'CARTAO_CREDITO' ? 'text-indigo-700' : 'text-gray-700'">Credito</span>
                    </button>
                    <button x-on:click="paymentMethod = 'CARTAO_DEBITO'"
                            class="payment-method-card p-4 rounded-xl border-2 text-center transition-all"
                            :class="paymentMethod === 'CARTAO_DEBITO' ? 'border-indigo-500 bg-indigo-50 shadow-md' : 'border-gray-200 hover:border-gray-300'">
                        <i data-lucide="credit-card" class="w-8 h-8 mx-auto mb-2"
                           :class="paymentMethod === 'CARTAO_DEBITO' ? 'text-indigo-600' : 'text-gray-400'"></i>
                        <span class="text-sm font-semibold"
                              :class="paymentMethod === 'CARTAO_DEBITO' ? 'text-indigo-700' : 'text-gray-700'">Debito</span>
                    </button>
                    <button x-on:click="paymentMethod = 'PIX'"
                            class="payment-method-card p-4 rounded-xl border-2 text-center transition-all"
                            :class="paymentMethod === 'PIX' ? 'border-indigo-500 bg-indigo-50 shadow-md' : 'border-gray-200 hover:border-gray-300'">
                        <i data-lucide="smartphone" class="w-8 h-8 mx-auto mb-2"
                           :class="paymentMethod === 'PIX' ? 'text-indigo-600' : 'text-gray-400'"></i>
                        <span class="text-sm font-semibold"
                              :class="paymentMethod === 'PIX' ? 'text-indigo-700' : 'text-gray-700'">PIX</span>
                    </button>
                    <button x-on:click="paymentMethod = 'FIADO'"
                            class="payment-method-card p-4 rounded-xl border-2 text-center transition-all"
                            :class="paymentMethod === 'FIADO' ? 'border-amber-500 bg-amber-50 shadow-md' : 'border-gray-200 hover:border-gray-300'">
                        <i data-lucide="file-text" class="w-8 h-8 mx-auto mb-2"
                           :class="paymentMethod === 'FIADO' ? 'text-amber-600' : 'text-gray-400'"></i>
                        <span class="text-sm font-semibold"
                              :class="paymentMethod === 'FIADO' ? 'text-amber-700' : 'text-gray-700'">Fiado</span>
                    </button>
                </div>

                <div x-show="paymentMethod === 'FIADO'" x-transition class="mb-4 p-4 bg-amber-50 border border-amber-200 rounded-xl">
                    <div class="flex items-start space-x-3">
                        <i data-lucide="alert-triangle" class="w-5 h-5 text-amber-500 mt-0.5 flex-shrink-0"></i>
                        <div>
                            <p class="text-sm font-medium text-amber-800">Venda a fiado</p>
                            <p class="text-xs text-amber-600 mt-1" x-text="orderClientName ? 'Cliente: ' + orderClientName : 'Selecione um cliente antes de abrir o pedido para usar fiado.'"></p>
                        </div>
                    </div>
                </div>

                <div x-show="paymentMethod === 'DINHEIRO'" x-transition class="mb-6 p-4 bg-gray-50 rounded-xl">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Valor Recebido</label>
                    <input type="number" step="0.01" min="0"
                           x-model.number="cashReceived"
                           class="w-full px-4 py-3 border border-gray-200 rounded-xl text-lg font-semibold focus:border-indigo-500"
                           placeholder="0,00">
                    <div class="mt-3 flex justify-between items-center" x-show="cashReceived > 0">
                        <span class="text-sm text-gray-500">Troco:</span>
                        <span class="text-xl font-bold"
                              :class="change >= 0 ? 'text-emerald-600' : 'text-red-600'"
                              x-text="formatCurrency(change)"></span>
                    </div>
                </div>

                <button x-on:click="closeOrder()"
                        :disabled="!paymentMethod || (paymentMethod === 'DINHEIRO' && cashReceived < paymentTotal) || (paymentMethod === 'FIADO' && !orderClientName)"
                        class="w-full px-6 py-3.5 bg-emerald-600 hover:bg-emerald-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white rounded-xl font-semibold text-lg transition-colors shadow-lg shadow-emerald-600/25">
                    <span x-text="paymentMethod === 'FIADO' ? 'Confirmar Fiado' : 'Confirmar Pagamento'"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- DISCOUNT MODAL -->
    <div x-show="showDiscountModal" x-cloak
         class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 overflow-hidden"
             x-on:click.outside="showDiscountModal = false">
            <div class="px-6 py-4 border-b border-gray-100">
                <h3 class="text-lg font-bold text-gray-900">Aplicar Desconto</h3>
            </div>
            <div class="p-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Valor do Desconto (R$)</label>
                <input type="number" step="0.01" min="0"
                       x-model.number="orderDiscount"
                       class="w-full px-4 py-3 border border-gray-200 rounded-xl text-lg font-semibold focus:border-indigo-500"
                       placeholder="0,00">
                <div class="mt-4 flex space-x-3">
                    <button x-on:click="showDiscountModal = false"
                            class="flex-1 px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-sm font-medium transition-colors">
                        Cancelar
                    </button>
                    <button x-on:click="showDiscountModal = false"
                            class="flex-1 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold">
                        Aplicar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- SPLIT ACCOUNT MODAL -->
    <div x-show="showSplitModal" x-cloak
         class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 overflow-hidden"
             x-on:click.outside="showSplitModal = false">
            <div class="px-6 py-4 border-b border-gray-100">
                <h3 class="text-lg font-bold text-gray-900">Dividir Conta</h3>
            </div>
            <div class="p-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Numero de Pessoas</label>
                <input type="number" min="2" max="50"
                       x-model.number="splitPeople"
                       class="w-full px-4 py-3 border border-gray-200 rounded-xl text-lg font-semibold focus:border-indigo-500"
                       placeholder="2">
                <div class="mt-4 p-4 bg-indigo-50 rounded-xl text-center" x-show="splitPeople > 1">
                    <p class="text-sm text-indigo-600 mb-1">Valor por pessoa</p>
                    <p class="text-2xl font-bold text-indigo-700" x-text="formatCurrency(splitValue)"></p>
                </div>
                <div class="mt-4 flex space-x-3">
                    <button x-on:click="showSplitModal = false"
                            class="flex-1 px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-sm font-medium transition-colors">
                        Fechar
                    </button>
                    <button x-on:click="submitSplit()"
                            :disabled="!splitPeople || splitPeople < 2"
                            class="flex-1 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 text-white rounded-xl text-sm font-semibold transition-colors">
                        Dividir
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:inline="javascript">
        lucide.createIcons();

        function pdvApp() {
            return {
                searchQuery: '',
                selectedCategory: 'Todos',
                currentTime: '',
                mesas: [],
                produtos: [],
                clientes: [],
                categorias: [],
                filteredProducts: [],
                selectedTable: null,
                selectedClientId: '',
                orderClientName: '',
                currentOrderId: null,
                orderItems: [],
                orderSubtotal: 0,
                orderDiscount: 0,
                paymentMethod: '',
                cashReceived: 0,
                showPaymentModal: false,
                showDiscountModal: false,
                showSplitModal: false,
                splitPeople: 2,
                productQuantities: {},

                get paymentTotal() {
                    return this.orderSubtotal - this.orderDiscount;
                },

                get change() {
                    return this.cashReceived - this.paymentTotal;
                },

                get splitValue() {
                    return this.splitPeople > 0 ? this.paymentTotal / this.splitPeople : 0;
                },

                updateFilteredProducts() {
                    let list = this.produtos;
                    if (this.selectedCategory !== 'Todos') {
                        list = list.filter(p => p.categoria === this.selectedCategory);
                    }
                    if (this.searchQuery.trim()) {
                        const q = this.searchQuery.toLowerCase();
                        list = list.filter(p =>
                            p.nome.toLowerCase().includes(q)
                        );
                    }
                    this.filteredProducts = list;
                },

                init() {
                    this.mesas = /*[[${mesas}]]*/ [];
                    this.produtos = /*[[${produtos}]]*/ [];
                    this.clientes = /*[[${clientes}]]*/ [];
                    this.categorias = /*[[${categorias}]]*/ [];

                    this.updateFilteredProducts();

                    this.$watch('searchQuery', () => this.updateFilteredProducts());
                    this.$watch('selectedCategory', () => this.updateFilteredProducts());

                    const pedidoAberto = /*[[${pedidoAberto}]]*/ null;
                    if (pedidoAberto && pedidoAberto.id) {
                        this.currentOrderId = pedidoAberto.id;
                        if (pedidoAberto.mesaNumero) {
                            this.selectedTable = this.mesas.find(m => m.numero === pedidoAberto.mesaNumero) || { numero: pedidoAberto.mesaNumero };
                        }
                        this.orderClientName = pedidoAberto.clienteNome || '';
                        if (pedidoAberto.itens) {
                            this.orderItems = pedidoAberto.itens.map(item => ({
                                itemId: item.id,
                                produtoId: item.produto.id,
                                nome: item.produto.nome,
                                precoUnitario: item.precoUnitario,
                                quantidade: item.quantidade
                            }));
                            this.recalcSubtotal();
                        }
                    }

                    this.updateClock();
                    setInterval(() => this.updateClock(), 1000);
                },

                updateClock() {
                    this.currentTime = new Date().toLocaleTimeString('pt-BR', {
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                },

                getQty(produtoId) {
                    return this.productQuantities[produtoId] || 1;
                },

                incrementQty(produto) {
                    const current = this.getQty(produto.id);
                    if (current < produto.estoqueAtual) {
                        this.productQuantities = { ...this.productQuantities, [produto.id]: current + 1 };
                    }
                },

                decrementQty(produto) {
                    const current = this.getQty(produto.id);
                    if (current > 1) {
                        this.productQuantities = { ...this.productQuantities, [produto.id]: current - 1 };
                    }
                },

                submitForm(url, params) {
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = url;
                    for (const [key, value] of Object.entries(params)) {
                        const input = document.createElement('input');
                        input.type = 'hidden';
                        input.name = key;
                        input.value = value || '';
                        form.appendChild(input);
                    }
                    document.body.appendChild(form);
                    form.submit();
                },

                selectTable(mesa) {
                    this.selectedTable = mesa;
                    const params = { mesaId: mesa.id };
                    if (this.selectedClientId) params.clienteId = this.selectedClientId;
                    this.submitForm('/pdv/novo', params);
                },

                addToOrder(produto) {
                    if (produto.estoqueAtual <= 0) return;
                    if (!this.currentOrderId) {
                        // Create order first, then add item
                        this.submitForm('/pdv/novo-pedido-com-item', {
                            produtoId: produto.id,
                            quantidade: this.getQty(produto.id),
                            clienteId: this.selectedClientId || '',
                            mesaId: this.selectedTable ? this.selectedTable.id : ''
                        });
                        return;
                    }
                    const qty = this.getQty(produto.id);
                    this.submitForm('/pdv/' + this.currentOrderId + '/adicionar-item', {
                        produtoId: produto.id,
                        quantidade: qty
                    });
                },

                assignClient(cliente) {
                    if (!this.currentOrderId) return;
                    if (cliente) {
                        this.selectedClientId = cliente.id;
                        this.orderClientName = cliente.nome;
                        this.submitForm('/pdv/' + this.currentOrderId + '/atribuir-cliente', { clienteId: cliente.id });
                    } else {
                        this.selectedClientId = '';
                        this.orderClientName = '';
                        this.submitForm('/pdv/' + this.currentOrderId + '/atribuir-cliente', { clienteId: '' });
                    }
                },

                assignMesa(mesa) {
                    if (!this.currentOrderId || mesa.status === 'OCUPADA') return;
                    this.submitForm('/pdv/' + this.currentOrderId + '/atribuir-mesa', { mesaId: mesa.id });
                },

                unassignMesa() {
                    if (!this.currentOrderId || !this.selectedTable) return;
                    this.submitForm('/pdv/' + this.currentOrderId + '/desatribuir-mesa', {});
                },

                newOrder() {
                    this.submitForm('/pdv/novo-pedido', {});
                },

                updateQuantity(index, delta) {
                    const item = this.orderItems[index];
                    const newQty = item.quantidade + delta;
                    if (newQty <= 0) {
                        this.removeItem(index);
                        return;
                    }
                    this.submitForm('/pdv/' + this.currentOrderId + '/atualizar-quantidade', {
                        itemId: item.itemId,
                        quantidade: newQty
                    });
                },

                removeItem(index) {
                    const item = this.orderItems[index];
                    this.submitForm('/pdv/' + this.currentOrderId + '/remover-item/' + item.itemId, {});
                },

                recalcSubtotal() {
                    this.orderSubtotal = this.orderItems.reduce((sum, item) => sum + (item.quantidade * item.precoUnitario), 0);
                },

                cancelOrder() {
                    if (!confirm('Tem certeza que deseja cancelar este pedido?')) return;
                    this.submitForm('/pdv/' + this.currentOrderId + '/cancelar', {});
                },

                submitSplit() {
                    this.submitForm('/pdv/' + this.currentOrderId + '/dividir', {
                        numPessoas: this.splitPeople
                    });
                },

                closeOrder() {
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/pdv/' + this.currentOrderId + '/fechar';

                    const mpField = document.createElement('input');
                    mpField.type = 'hidden';
                    mpField.name = 'formaPagamento';
                    mpField.value = this.paymentMethod;
                    form.appendChild(mpField);

                    if (this.paymentMethod === 'DINHEIRO') {
                        const receivedField = document.createElement('input');
                        receivedField.type = 'hidden';
                        receivedField.name = 'valorRecebido';
                        receivedField.value = this.cashReceived;
                        form.appendChild(receivedField);
                    }

                    const discountField = document.createElement('input');
                    discountField.type = 'hidden';
                    discountField.name = 'desconto';
                    discountField.value = this.orderDiscount;
                    form.appendChild(discountField);

                    document.body.appendChild(form);
                    form.submit();
                },

                formatCurrency: formatCurrency
            };
        }
    </script>
</body>
</html>
