<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Mesa - PDV NFCe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-gray-50 font-sans antialiased">

    <div th:if="${sucesso}" data-success-message="${sucesso}" hidden></div>
    <div th:if="${erro}" data-error-message="${erro}" hidden></div>

    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div th:replace="~{fragments/layout :: toasts}"></div>

    <div class="ml-0 lg:ml-64 transition-all duration-300">
        <div class="p-6 lg:p-8 max-w-2xl">

            <div class="flex items-center space-x-3 mb-8">
                <a href="/mesas" class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-200 rounded-lg transition-all">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </a>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Nova Mesa</h1>
                    <p class="text-sm text-gray-500 mt-0.5">Configure uma nova mesa</p>
                </div>
            </div>

            <form th:action="@{/mesas/salvar}" th:object="${mesa}" method="POST" class="space-y-6">
                <input type="hidden" th:field="*{id}">

                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4 flex items-center space-x-2">
                        <i data-lucide="grid-3x3" class="w-5 h-5 text-indigo-500"></i>
                        <span>Dados da Mesa</span>
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Número da Mesa *</label>
                            <input type="number" th:field="*{numero}"
                                   class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:border-indigo-500"
                                   placeholder="Ex: 1" min="1" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Capacidade</label>
                            <input type="number" th:field="*{capacidade}"
                                   class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:border-indigo-500"
                                   placeholder="4" min="1" value="4">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Observação</label>
                            <input type="text" th:field="*{observacao}"
                                   class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:border-indigo-500"
                                   placeholder="Ex: Mesa da varanda, área externa...">
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-3">
                    <a href="/mesas"
                       class="px-6 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-sm font-medium transition-colors">
                        Cancelar
                    </a>
                    <button type="submit"
                            class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold transition-colors shadow-lg shadow-indigo-600/25">
                        Criar Mesa
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
