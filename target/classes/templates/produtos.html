<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - PDV NFCe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-gray-50 font-sans antialiased">

    <div th:if="${sucesso}" data-success-message="${sucesso}" hidden></div>
    <div th:if="${erro}" data-error-message="${erro}" hidden></div>

    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div th:replace="~{fragments/layout :: toasts}"></div>

    <div class="ml-0 lg:ml-64 transition-all duration-300">
        <div class="p-6 lg:p-8">

            <div class="flex items-center justify-between mb-8">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Produtos</h1>
                    <p class="text-sm text-gray-500 mt-1">Gerencie seu catalogo de produtos</p>
                </div>
                <a href="/produtos/novo"
                   class="inline-flex items-center space-x-2 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold transition-colors shadow-lg shadow-indigo-600/25">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>Novo Produto</span>
                </a>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-6"
                 x-data="{ search: '', category: '', stockFilter: '' }">
                <div class="flex flex-wrap gap-4 items-end">
                    <div class="flex-1 min-w-[200px]">
                        <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">Buscar</label>
                        <div class="relative">
                            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                            <input type="text" x-model="search"
                                   onkeyup="filterTable(this.value, document.getElementById('categoryFilter').value, document.getElementById('stockFilter').value)"
                                   placeholder="Buscar por nome..."
                                   class="w-full pl-9 pr-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:border-indigo-500">
                        </div>
                    </div>
                    <div class="min-w-[160px]">
                        <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">Categoria</label>
                        <select id="categoryFilter"
                                onchange="filterTable(document.querySelector('[x-model=search]').value, this.value, document.getElementById('stockFilter').value)"
                                class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm bg-white focus:border-indigo-500">
                            <option value="">Todas</option>
                            <option th:each="cat : ${categorias}" th:value="${cat}" th:text="${cat}"></option>
                        </select>
                    </div>
                    <div class="min-w-[140px]">
                        <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1.5">Estoque</label>
                        <select id="stockFilter"
                                onchange="filterTable(document.querySelector('[x-model=search]').value, document.getElementById('categoryFilter').value, this.value)"
                                class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm bg-white focus:border-indigo-500">
                            <option value="">Todos</option>
                            <option value="low">Estoque Baixo</option>
                            <option value="out">Sem Estoque</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="text-left text-xs font-medium text-gray-500 uppercase tracking-wider bg-gray-50">
                                <th class="px-6 py-3">Nome</th>
                                <th class="px-6 py-3 text-right">Preco Custo</th>
                                <th class="px-6 py-3 text-right">Preco Venda</th>
                                <th class="px-6 py-3 text-right">Margem</th>
                                <th class="px-6 py-3">Estoque</th>
                                <th class="px-6 py-3">Status</th>
                                <th class="px-6 py-3 text-right">Acoes</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-50" id="produtosTable">
                            <tr th:each="produto : ${produtos}" class="table-row-hover"
                                th:attr="data-nome=${produto.nome}, data-categoria=${produto.categoria}, data-estoque=${produto.estoqueAtual}, data-minimo=${produto.estoqueMinimo}">
                                <td class="px-6 py-3">
                                    <span class="text-sm font-semibold text-gray-900" th:text="${produto.nome}">Produto</span>
                                    <span class="block text-xs text-gray-400" th:if="${produto.categoria}" th:text="${produto.categoria}">Categoria</span>
                                </td>
                                <td class="px-6 py-3 text-sm text-gray-500 text-right"
                                    th:text="'R$ ' + ${#numbers.formatDecimal(produto.precoCusto, 1, 2)}">R$ 0,00</td>
                                <td class="px-6 py-3 text-sm font-semibold text-gray-900 text-right"
                                    th:text="'R$ ' + ${#numbers.formatDecimal(produto.precoVenda, 1, 2)}">R$ 0,00</td>
                                <td class="px-6 py-3 text-sm text-right"
                                     th:classappend="${produto.precoCusto > 0 ? (produto.precoVenda / produto.precoCusto - 1) * 100 >= 20 ? 'text-emerald-600 font-semibold' : 'text-gray-600' : 'text-gray-400'}"
                                     th:text="${produto.precoCusto > 0 ? #numbers.formatDecimal((produto.precoVenda / produto.precoCusto - 1) * 100, 1, 1) + '%' : '-' }">
                                    0%
                                </td>
                                <td class="px-6 py-3">
                                    <div class="flex items-center space-x-3">
                                        <div class="stock-bar flex-1 max-w-[80px]">
                                            <div class="stock-bar-fill"
                                                 th:style="'width:' + (${produto.estoqueMinimo > 0} ? ${#numbers.formatDecimal(produto.estoqueAtual * 100 / (produto.estoqueMinimo * 2), 1, 0)} : '100') + '%'"
                                                 th:classappend="${produto.estoqueAtual <= 0 ? 'bg-red-500' : produto.estoqueAtual <= produto.estoqueMinimo ? 'bg-amber-500' : 'bg-emerald-500'}">
                                            </div>
                                        </div>
                                        <span class="text-sm font-medium"
                                              th:classappend="${produto.estoqueAtual <= 0 ? 'text-red-600' : produto.estoqueAtual <= produto.estoqueMinimo ? 'text-amber-600' : 'text-gray-700'}"
                                              th:text="${produto.estoqueAtual}">
                                        </span>
                                    </div>
                                </td>
                                <td class="px-6 py-3">
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                                          th:classappend="${produto.estoqueAtual <= 0 ? 'badge-danger' : produto.estoqueAtual <= produto.estoqueMinimo ? 'badge-warning' : 'badge-success'}"
                                          th:text="${produto.estoqueAtual <= 0 ? 'Sem Estoque' : produto.estoqueAtual <= produto.estoqueMinimo ? 'Estoque Baixo' : 'Disponivel'}">
                                    </span>
                                </td>
                                <td class="px-6 py-3 text-right">
                                    <div class="flex items-center justify-end space-x-2">
                                        <a th:href="@{/produtos/{id}/editar(id=${produto.id})}"
                                           class="p-2 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all"
                                           title="Editar">
                                            <i data-lucide="pencil" class="w-4 h-4"></i>
                                        </a>
                                        <form th:action="@{/produtos/deletar/{id}(id=${produto.id})}" method="POST" class="inline"
                                              onsubmit="return confirm('Tem certeza que deseja excluir este produto?')">
                                            <button type="submit"
                                                    class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all"
                                                    title="Excluir">
                                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div th:if="${produtos == null or produtos.isEmpty()}" class="px-6 py-16 text-center">
                    <i data-lucide="package" class="w-16 h-16 text-gray-300 mx-auto mb-4"></i>
                    <h3 class="text-lg font-semibold text-gray-700 mb-1">Nenhum produto cadastrado</h3>
                    <p class="text-gray-400 text-sm mb-6">Comece cadastrando seu primeiro produto</p>
                    <a href="/produtos/novo"
                       class="inline-flex items-center space-x-2 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold transition-colors">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>Novo Produto</span>
                    </a>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>
        lucide.createIcons();

        function filterTable(search, category, stock) {
            const rows = document.querySelectorAll('#produtosTable tr');
            search = (search || '').toLowerCase();
            rows.forEach(row => {
                const nome = (row.getAttribute('data-nome') || '').toLowerCase();
                const cat = row.getAttribute('data-categoria') || '';
                const estoque = parseInt(row.getAttribute('data-estoque') || '0');
                const minimo = parseInt(row.getAttribute('data-minimo') || '0');

                let show = true;
                if (search && !nome.includes(search)) show = false;
                if (category && cat !== category) show = false;
                if (stock === 'low' && (estoque <= 0 || estoque > minimo)) show = false;
                if (stock === 'out' && estoque > 0) show = false;

                row.style.display = show ? '' : 'none';
            });
        }
    </script>
</body>
</html>
