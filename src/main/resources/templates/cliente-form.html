<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${cliente != null and cliente.id != null ? 'Editar Cliente' : 'Novo Cliente'} + ' - PDV NFCe'">Cliente - PDV NFCe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-gray-50 font-sans antialiased">

    <div th:if="${sucesso}" data-success-message="${sucesso}" hidden></div>
    <div th:if="${erro}" data-error-message="${erro}" hidden></div>

    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div th:replace="~{fragments/layout :: toasts}"></div>

    <div class="ml-0 lg:ml-64 transition-all duration-300">
        <div class="p-6 lg:p-8 max-w-2xl">

            <!-- Header -->
            <div class="flex items-center space-x-3 mb-8">
                <a href="/clientes" class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-200 rounded-lg transition-all">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </a>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900"
                        th:text="${cliente != null and cliente.id != null ? 'Editar Cliente' : 'Novo Cliente'}">Cliente</h1>
                    <p class="text-sm text-gray-500 mt-0.5">Preencha os dados do cliente</p>
                </div>
            </div>

            <!-- Form -->
            <form th:action="@{/clientes/salvar}" th:object="${cliente}" method="POST" class="space-y-6">

                <input type="hidden" th:field="*{id}" th:if="${cliente != null and cliente.id != null}">

                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4 flex items-center space-x-2">
                        <i data-lucide="user" class="w-5 h-5 text-indigo-500"></i>
                        <span>Dados Pessoais</span>
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Nome Completo *</label>
                            <input type="text" th:field="*{nome}"
                                   class="w-full px-4 py-2.5 border rounded-xl text-sm"
                                   th:classappend="${#fields.hasErrors('nome')} ? 'border-red-300' : 'border-gray-200'"
                                   placeholder="Nome completo do cliente">
                            <p class="mt-1 text-xs text-red-500" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">CPF/CNPJ</label>
                            <input type="text" th:field="*{cpfCnpj}"
                                   class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:border-indigo-500"
                                   placeholder="000.000.000-00 ou 00.000.000/0000-00"
                                   x-data="{ val: '' }"
                                   x-init="val = $el.value"
                                   x-on:input="val = $el.value; $el.value = val.replace(/\D/g, '').length <= 11 ? val.replace(/\D/g, '').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2') : val.replace(/\D/g, '').replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2')">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Telefone</label>
                            <input type="text" th:field="*{telefone}"
                                   class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:border-indigo-500"
                                   placeholder="(00) 00000-0000">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
                            <input type="email" th:field="*{email}"
                                   class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:border-indigo-500"
                                   placeholder="cliente@email.com">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Endereço</label>
                            <input type="text" th:field="*{endereco}"
                                   class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:border-indigo-500"
                                   placeholder="Rua, número, bairro, cidade - UF">
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center justify-end space-x-3">
                    <a href="/clientes"
                       class="px-6 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-sm font-medium transition-colors">
                        Cancelar
                    </a>
                    <button type="submit"
                            class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold transition-colors shadow-lg shadow-indigo-600/25">
                        <span th:text="${cliente != null and cliente.id != null ? 'Salvar Alterações' : 'Cadastrar Cliente'}">Salvar</span>
                    </button>
                </div>
            </form>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
