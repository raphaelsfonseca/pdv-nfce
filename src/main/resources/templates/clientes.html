<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - PDV NFCe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-gray-50 font-sans antialiased">

    <div th:if="${sucesso}" data-success-message="${sucesso}" hidden></div>
    <div th:if="${erro}" data-error-message="${erro}" hidden></div>

    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div th:replace="~{fragments/layout :: toasts}"></div>

    <div class="ml-0 lg:ml-64 transition-all duration-300">
        <div class="p-6 lg:p-8">

            <!-- Header -->
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Clientes</h1>
                    <p class="text-sm text-gray-500 mt-1">Gerencie seu cadastro de clientes</p>
                </div>
                <a href="/clientes/novo"
                   class="inline-flex items-center space-x-2 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold transition-colors shadow-lg shadow-indigo-600/25">
                    <i data-lucide="user-plus" class="w-4 h-4"></i>
                    <span>Novo Cliente</span>
                </a>
            </div>

            <!-- Search Bar -->
            <div class="mb-6" x-data="{ search: '' }">
                <div class="relative max-w-md">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                    <input type="text" x-model="search"
                           onkeyup="filterClientes(this.value)"
                           placeholder="Buscar por nome, CPF/CNPJ, email..."
                           class="w-full pl-9 pr-4 py-2.5 bg-white border border-gray-200 rounded-xl text-sm focus:border-indigo-500">
                </div>
            </div>

            <!-- Table -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="text-left text-xs font-medium text-gray-500 uppercase tracking-wider bg-gray-50">
                                <th class="px-6 py-3">Nome</th>
                                <th class="px-6 py-3">CPF/CNPJ</th>
                                <th class="px-6 py-3">Telefone</th>
                                <th class="px-6 py-3">Email</th>
                                <th class="px-6 py-3">Cadastro</th>
                                <th class="px-6 py-3 text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-50" id="clientesTable">
                            <tr th:each="cliente : ${clientes}" class="table-row-hover"
                                th:attr="data-search=${cliente.nome + ' ' + (cliente.cpfCnpj ?: '') + ' ' + (cliente.email ?: '')}">
                                <td class="px-6 py-3">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center">
                                            <span class="text-xs font-bold text-indigo-600"
                                                  th:text="${#strings.substring(cliente.nome, 0, 1)}">N</span>
                                        </div>
                                        <span class="text-sm font-semibold text-gray-900" th:text="${cliente.nome}">Nome</span>
                                    </div>
                                </td>
                                <td class="px-6 py-3 text-sm text-gray-500 font-mono" th:text="${cliente.cpfCnpj}">000.000.000-00</td>
                                <td class="px-6 py-3 text-sm text-gray-500" th:text="${cliente.telefone}">(00) 00000-0000</td>
                                <td class="px-6 py-3 text-sm text-gray-500" th:text="${cliente.email}">email@exemplo.com</td>
                                <td class="px-6 py-3 text-sm text-gray-400"
                                    th:text="${cliente.dataCadastro != null ? #temporals.format(cliente.dataCadastro, 'dd/MM/yyyy') : '-'}">01/01/2026</td>
                                <td class="px-6 py-3 text-right">
                                    <div class="flex items-center justify-end space-x-2">
                                        <a th:href="@{/clientes/{id}/editar(id=${cliente.id})}"
                                           class="p-2 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all"
                                           title="Editar">
                                            <i data-lucide="pencil" class="w-4 h-4"></i>
                                        </a>
                                        <form th:action="@{/clientes/deletar/{id}(id=${cliente.id})}" method="POST" class="inline"
                                              onsubmit="return confirm('Tem certeza que deseja excluir este cliente?')">
                                            <button type="submit"
                                                    class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all"
                                                    title="Excluir">
                                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Empty State -->
                <div th:if="${clientes == null or clientes.isEmpty()}" class="px-6 py-16 text-center">
                    <i data-lucide="users" class="w-16 h-16 text-gray-300 mx-auto mb-4"></i>
                    <h3 class="text-lg font-semibold text-gray-700 mb-1">Nenhum cliente cadastrado</h3>
                    <p class="text-gray-400 text-sm mb-6">Cadastre seus clientes para começar</p>
                    <a href="/clientes/novo"
                       class="inline-flex items-center space-x-2 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold transition-colors">
                        <i data-lucide="user-plus" class="w-4 h-4"></i>
                        <span>Novo Cliente</span>
                    </a>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>
        lucide.createIcons();

        function filterClientes(query) {
            query = (query || '').toLowerCase();
            document.querySelectorAll('#clientesTable tr').forEach(row => {
                const search = (row.getAttribute('data-search') || '').toLowerCase();
                row.style.display = search.includes(query) ? '' : 'none';
            });
        }
    </script>
</body>
</html>
